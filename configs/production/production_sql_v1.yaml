production:
  config_version: "1.0"
  run_name: production-sql-v1
  target_golden_records: 1000
  initial_task_batch: 500
  candidates_per_task: 3
  max_batches: 8
  batches_per_authorization: 1
  output_dir: runs/production-sql-v1
  seed: 12001
  model:
    model_id: alibilge/Huihui-Devstral-Small-2-24B-Instruct-2512-abliterated:latest
    model_revision: ollama-digest:a2d26ea0b96b7a40afd673158d5cf44de25eff07fc8abf835e2cde5444632bc4
    provider: devstral
    governance_status: REVIEW_REQUIRED_NON_COMMERCIAL
    endpoint: http://localhost:11434/v1
    prompt_version: sql-v2
    parser_version: "1.0"
    temperature: 0.4
    top_p: 0.95
    max_tokens: 2048
  budget:
    max_total_tasks: 4000
    max_total_candidates: 12000
    max_wall_time_minutes: 1440
  family_distribution:
    simple_joins: 50
    multi_joins: 50
    aggregation: 50
    cte: 50
    subqueries: 50
    window_functions: 50
    temporal: 50
    deduplication: 50
    retention: 50
    funnel: 50
  quality_config: configs/quality_example.yaml
  sandbox_config: configs/sandbox_production.yaml
  provenance_config: configs/provenance_example.yaml
  product_config: configs/product_example.yaml
  audit:
    sample_size: 100
    risk_based_selection: true
    seed: 42001
  pause_conditions:
    zero_golden_attempts: 60
    execution_error_rate: 0.45
    inconclusive_rate: 0.25
    semantic_duplicate_rate: 0.85
  diversity_warnings:
    semantic_duplicate_rate: 0.75
    structural_duplicate_rate: 0.35
    exact_duplicate_rate: 0.25
  private_benchmark_target: 150
  business_hypothesis: INSUFFICIENT_EVIDENCE

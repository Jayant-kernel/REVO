[project]
name = "verified-data-factory"
version = "0.8.0"
description = "Verification-first synthetic data factory for AI coding/data agents. Phase 8: Commercial & GTM Validation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD — see docs/licensing.md (no license granted yet; commercial licensing to be defined before distribution)" }
authors = [{ name = "Verified SQL Data Factory" }]
keywords = ["sql", "synthetic-data", "verification", "duckdb", "ai-agents"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

# Phase 1 uses duckdb at runtime (ADR-002). Phase 2 adds httpx for
# OpenAI-compatible open-weight model servers (vLLM-style, self-hosted).
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "duckdb>=1.0",
  "httpx>=0.27",
  "pyarrow>=15.0",
]

[project.scripts]
factory = "verified_data_factory.cli:main"

[project.optional-dependencies]
# Documented here so the intended stack is visible, but NOT installed by default in Phase 0.
sql = ["duckdb>=1.0"]
test = ["pytest>=8.0", "hypothesis>=6.0"]
dev = ["pytest>=8.0", "hypothesis>=6.0", "ruff>=0.4", "mypy>=1.10", "types-PyYAML>=6.0"]

[project.urls]
Homepage = ""
Documentation = "docs/architecture.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verified_data_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: Docker-daemon integration tests (skipped when unavailable)",
  "docker: tests requiring a Docker daemon",
  "e2e: end-to-end Phase 3 + Phase 4 pipeline tests (real Docker)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
